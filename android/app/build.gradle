plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseStoreFile = (findProperty("FITLOOT_ANDROID_KEYSTORE") ?: System.getenv("FITLOOT_ANDROID_KEYSTORE"))?.toString()
def releaseStorePassword = (findProperty("FITLOOT_ANDROID_KEYSTORE_PASSWORD") ?: System.getenv("FITLOOT_ANDROID_KEYSTORE_PASSWORD"))?.toString()
def releaseKeyAlias = (findProperty("FITLOOT_ANDROID_KEY_ALIAS") ?: System.getenv("FITLOOT_ANDROID_KEY_ALIAS"))?.toString()
def releaseKeyPassword = (findProperty("FITLOOT_ANDROID_KEY_PASSWORD") ?: System.getenv("FITLOOT_ANDROID_KEY_PASSWORD"))?.toString()
def defaultDevWebBaseUrl = "http://10.0.2.2:5173"
def devWebBaseUrl = (findProperty("FITLOOT_DEV_WEB_BASE_URL") ?: System.getenv("FITLOOT_DEV_WEB_BASE_URL") ?: defaultDevWebBaseUrl).toString().trim().replaceAll("/+\$", "")
def explicitDevAllowedHosts = (findProperty("FITLOOT_DEV_ALLOWED_HOSTS") ?: System.getenv("FITLOOT_DEV_ALLOWED_HOSTS"))?.toString()?.trim()
def devWebUri = new URI(devWebBaseUrl)
def devAllowedHosts = explicitDevAllowedHosts ?: [devWebUri.host, "localhost", "fitloot.vercel.app"]
    .findAll { it != null && it.toString().trim().length() > 0 }
    .unique()
    .join(",")

android {
    namespace 'com.fitloot'
    compileSdk 34

    signingConfigs {
        debug {}
        release {
            if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            } else {
                initWith signingConfigs.debug
            }
        }
    }

    defaultConfig {
        applicationId "com.fitloot"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    flavorDimensions += ["environment"]

    productFlavors {
        dev {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            buildConfigField "String", "WEB_BASE_URL", "\"${devWebBaseUrl}\""
            buildConfigField "String", "ALLOWED_HOSTS", "\"${devAllowedHosts}\""
            buildConfigField "String", "WEB_MODE", '"remote"'
            buildConfigField "String", "HOST_BUILD_TYPE", '"dev"'
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }

        internal {
            dimension "environment"
            applicationIdSuffix ".internal"
            versionNameSuffix "-internal"
            buildConfigField "String", "WEB_BASE_URL", '"https://fitloot.vercel.app"'
            buildConfigField "String", "ALLOWED_HOSTS", '"fitloot.vercel.app"'
            buildConfigField "String", "WEB_MODE", '"remote"'
            buildConfigField "String", "HOST_BUILD_TYPE", '"internal"'
            manifestPlaceholders = [usesCleartextTraffic: "false"]
        }

        prod {
            dimension "environment"
            buildConfigField "String", "WEB_BASE_URL", '"https://fitloot.vercel.app"'
            buildConfigField "String", "ALLOWED_HOSTS", '"fitloot.vercel.app"'
            buildConfigField "String", "WEB_MODE", '"remote"'
            buildConfigField "String", "HOST_BUILD_TYPE", '"prod"'
            manifestPlaceholders = [usesCleartextTraffic: "false"]
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // CameraX
    def camerax_version = "1.3.0"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    
    // Guava (Required by CameraX for ListenableFuture)
    implementation "com.google.guava:guava:32.1.3-android"

    // Health Connect
    implementation "androidx.health.connect:connect-client:1.1.0-alpha07"
    implementation "com.google.android.gms:play-services-location:21.3.0"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
